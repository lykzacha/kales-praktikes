<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d4a41">
<title>Τράπεζα Καλών Πρακτικών</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; background: #1d4a41; color: #eef6f2;
         font-family: "Segoe UI", system-ui, sans-serif; text-align: center; padding: 20px; box-sizing: border-box; }
  h1 { font-family: Georgia, serif; font-size: 30px; margin: 0 0 10px; }
  h1 span { border-bottom: 3px solid #e2ad25; }
  p { margin: 0 0 22px; opacity: .9; max-width: 46ch; line-height: 1.55; }
  a.btn { display: inline-block; background: #e2ad25; color: #1a1606; font-weight: 600; text-decoration: none;
          padding: 12px 22px; border-radius: 8px; }
  a.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  small { display: block; margin-top: 18px; opacity: .75; }
  small a { color: #e2ad25; }
</style>
</head>
<body>
  <main>
    <h1>Τράπεζα <span>Καλών Πρακτικών</span></h1>
    <p id="msg">Μεταφέρεστε στην εφαρμογή…</p>
    <a class="btn" id="go" href="#">Άνοιγμα της εφαρμογής</a>
    <small><a href="https://lykzacha.github.io/">← Αρχική σελίδα</a></small>
  </main>
<script>
  // Η διεύθυνση της εφαρμογής ιστού από το Apps Script (τελειώνει σε /exec)
  const APP_URL = "https://script.google.com/macros/s/AKfycbxJ3DBxqhb8amRn5q3BB0qgQsphFrsgldxeKXOD8-XhZAJWMRxwo_QxSgZm_LMsVdWF/exec";

  const url = APP_URL.trim();
  if (/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)) {
    document.getElementById("go").href = url;
    location.replace(url);
  } else {
    document.getElementById("msg").textContent = "Η σελίδα δεν έχει ρυθμιστεί: συμπληρώστε τη διεύθυνση APP_URL στο index.html.";
    document.getElementById("go").remove();
  }
</script>
</body>
</html>
